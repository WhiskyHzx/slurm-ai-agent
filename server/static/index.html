<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>107 算力控制台</title>
<style>
  :root {
    --bg: #f4f5f2;
    --surface: #ffffff;
    --surface-soft: #f8faf6;
    --ink: #18212f;
    --muted: #687484;
    --line: #dfe5dc;
    --blue: #2563eb;
    --teal: #0f766e;
    --amber: #b45309;
    --red: #b91c1c;
    --green: #15803d;
    --shadow: 0 10px 28px rgba(24, 33, 47, 0.08);
    --topbar-bg: rgba(255, 255, 255, 0.94);
    --focus-ring: rgba(37, 99, 235, 0.12);
    --modal-scrim: rgba(24, 33, 47, 0.28);
    --modal-shadow: 0 18px 50px rgba(24, 33, 47, 0.22);
    --group-bg: #fbfcf8;
    --group-hover: #f1f5ec;
    --notice-ink: #065f46;
    --notice-bg: #ecfdf5;
    --notice-line: #a7f3d0;
    --error-bg: #fef2f2;
    --error-line: #fecaca;
    --code-bg: rgba(0, 0, 0, 0.06);
    --assistant-shadow: 0 18px 42px rgba(37, 99, 235, 0.28);
    --assistant-hover: #1d4ed8;
    --tool-line: #fde68a;
    --tool-bg: #fffbeb;
    --tool-ink: #78350f;
    --primary-ink: #ffffff;
    --icon-btn-size: 36px;
  }

  :root[data-theme="dark"] {
    --bg: #0d0d0e;
    --surface: #171719;
    --surface-soft: #222225;
    --ink: #f3f4f6;
    --muted: #a1a1aa;
    --line: #343437;
    --blue: #818cf8;
    --teal: #2dd4bf;
    --amber: #fbbf24;
    --red: #f87171;
    --green: #34d399;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
    --topbar-bg: rgba(17, 17, 19, 0.96);
    --focus-ring: rgba(129, 140, 248, 0.2);
    --modal-scrim: rgba(0, 0, 0, 0.58);
    --modal-shadow: 0 18px 50px rgba(0, 0, 0, 0.56);
    --group-bg: #1d1d20;
    --group-hover: #28282b;
    --notice-ink: #86efac;
    --notice-bg: #10251c;
    --notice-line: #1f6f4a;
    --error-bg: #2a1517;
    --error-line: #7f1d1d;
    --code-bg: rgba(255, 255, 255, 0.08);
    --assistant-shadow: 0 18px 42px rgba(129, 140, 248, 0.24);
    --assistant-hover: #6366f1;
    --tool-line: #7c5c18;
    --tool-bg: #2b2110;
    --tool-ink: #fde68a;
    --primary-ink: #ffffff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
  }

  button, input {
    font: inherit;
  }

  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  .topbar {
    min-height: 64px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--topbar-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 180px;
  }

  .brand-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .brand-subtitle {
    color: var(--muted);
    font-size: 12px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
  }

  .project-input {
    width: 210px;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
  }

  .project-input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }

  .btn {
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }

  .btn:hover { background: var(--surface-soft); }
  .btn.primary {
    border-color: var(--blue);
    background: var(--blue);
    color: var(--primary-ink);
  }
  .btn.teal {
    border-color: var(--teal);
    background: var(--teal);
    color: var(--primary-ink);
  }
  :root[data-theme="dark"] .btn.primary,
  :root[data-theme="dark"] .btn.teal {
    border-color: var(--blue);
    background: #6366f1;
    color: #ffffff;
  }

  :root[data-theme="dark"] .btn.teal {
    border-color: var(--teal);
    background: #0f766e;
  }

  :root[data-theme="dark"] .btn.primary:hover {
    background: #4f46e5;
  }

  :root[data-theme="dark"] .btn.teal:hover {
    background: #0d9488;
  }

  .theme-toggle {
    width: var(--icon-btn-size);
    min-width: var(--icon-btn-size);
    padding: 0;
    display: inline-grid;
    place-items: center;
    font-size: 17px;
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .layout {
    display: block;
    padding: 18px;
    padding-bottom: 88px;
    max-width: 1680px;
    width: 100%;
    margin: 0 auto;
  }

  .main {
    min-width: 0;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .dashboard-stack {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 6px;
    height: calc(100vh - 172px);
    min-height: 460px;
  }

  .resource-module {
    display: block;
    min-width: 0;
    min-height: 0;
  }

  .resource-module .panel {
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }

  .panel-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .panel-heading {
    min-width: 0;
    display: grid;
    gap: 5px;
  }

  .panel-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .panel-stat {
    color: var(--ink);
    font-size: 14px;
    font-weight: 650;
    line-height: 1.45;
  }

  .panel-stat.secondary {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  .dashboard-footer {
    min-height: 34px;
    padding: 0 2px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .refresh-stamp {
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    min-height: 34px;
    padding: 4px 14px;
    font-size: 13px;
  }

  .refresh-stamp::after {
    content: attr(data-label);
  }

  .refresh-stamp:hover {
    border-color: var(--line);
    background: var(--surface-soft);
    color: var(--ink);
  }

  .refresh-stamp:hover::after {
    content: attr(data-hover);
  }

  .dropdown {
    position: relative;
  }

  .dropdown-menu {
    position: absolute;
    top: 42px;
    right: 0;
    min-width: 132px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
    display: none;
    z-index: 30;
  }

  .dropdown.open .dropdown-menu {
    display: grid;
    gap: 4px;
  }

  .dropdown-menu button {
    justify-content: flex-start;
    width: 100%;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: var(--modal-scrim);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--modal-shadow);
  }

  .modal-head, .modal-body, .modal-actions {
    padding: 14px 16px;
  }

  .modal-head {
    border-bottom: 1px solid var(--line);
    font-weight: 750;
  }

  .modal-body {
    display: grid;
    gap: 8px;
  }

  .modal-body label {
    color: var(--muted);
    font-size: 13px;
  }

  .modal-body input {
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .upload-choice {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 4px;
  }

  .modal-actions {
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px;
    min-height: 0;
  }

  .table-wrap {
    overflow: auto;
    min-height: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }

  th {
    color: var(--muted);
    background: var(--surface-soft);
    font-weight: 650;
    position: sticky;
    top: 0;
  }

  .group-row {
    background: var(--group-bg);
    cursor: pointer;
  }

  .group-row:hover {
    background: var(--group-hover);
  }

  .group-title {
    font-weight: 750;
  }

  .group-caret {
    display: inline-block;
    width: 16px;
    color: var(--muted);
  }

  .truncate {
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }

  .truncate.expanded {
    max-width: 420px;
    white-space: normal;
    word-break: break-word;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-soft);
    font-size: 12px;
    font-weight: 650;
  }

  .pill.green { color: var(--green); border-color: var(--notice-line); background: var(--notice-bg); }
  .pill.blue { color: var(--blue); border-color: var(--line); background: var(--surface-soft); }
  .pill.amber { color: var(--amber); border-color: var(--tool-line); background: var(--tool-bg); }
  .pill.red { color: var(--red); border-color: var(--error-line); background: var(--error-bg); }

  :root[data-theme="dark"] .pill.green {
    color: #86efac;
    border-color: rgba(52, 211, 153, 0.36);
    background: rgba(22, 101, 52, 0.24);
  }

  :root[data-theme="dark"] .pill.blue {
    color: #a5b4fc;
    border-color: rgba(129, 140, 248, 0.36);
    background: rgba(67, 56, 202, 0.22);
  }

  :root[data-theme="dark"] .pill.amber {
    color: #fcd34d;
    border-color: rgba(251, 191, 36, 0.38);
    background: rgba(146, 64, 14, 0.24);
  }

  :root[data-theme="dark"] .pill.red {
    color: #fca5a5;
    border-color: rgba(248, 113, 113, 0.38);
    background: rgba(127, 29, 29, 0.25);
  }

  .toast-stack {
    position: fixed;
    top: 76px;
    right: 18px;
    width: min(380px, calc(100vw - 36px));
    display: grid;
    gap: 10px;
    z-index: 50;
    pointer-events: none;
  }

  .toast {
    padding: 11px 36px 11px 13px;
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid;
    box-shadow: var(--shadow);
    animation: toastIn 0.18s ease-out;
    position: relative;
    pointer-events: auto;
  }

  .toast.notice {
    color: var(--notice-ink);
    background: var(--notice-bg);
    border-color: var(--notice-line);
  }

  .toast.error {
    color: var(--red);
    background: var(--error-bg);
    border-color: var(--error-line);
  }

  :root[data-theme="dark"] .toast.error {
    color: #fecaca;
    background: #2a1517;
    border-color: rgba(248, 113, 113, 0.42);
  }

  .toast-close {
    position: absolute;
    top: 6px;
    right: 7px;
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    border-radius: 6px;
  }

  .toast-close:hover {
    background: var(--code-bg);
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .assistant-toggle {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--blue);
    color: var(--primary-ink);
    box-shadow: var(--assistant-shadow);
    cursor: pointer;
    font-size: 24px;
    font-weight: 750;
    z-index: 40;
  }

  .assistant-toggle:hover {
    background: var(--assistant-hover);
  }

  .assistant {
    position: fixed;
    right: 22px;
    bottom: 92px;
    width: min(430px, calc(100vw - 32px));
    height: min(680px, calc(100vh - 120px));
    z-index: 45;
    display: none;
  }

  .assistant.open {
    display: block;
  }

  .assistant .panel {
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }

  .messages {
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 92%;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.markdown {
    white-space: normal;
  }

  .message.markdown p {
    margin: 0 0 8px;
  }

  .message.markdown p:last-child,
  .message.markdown ul:last-child,
  .message.markdown ol:last-child,
  .message.markdown pre:last-child {
    margin-bottom: 0;
  }

  .message.markdown h1,
  .message.markdown h2,
  .message.markdown h3,
  .message.markdown h4,
  .message.markdown h5,
  .message.markdown h6 {
    margin: 10px 0 6px;
    font-size: 15px;
    line-height: 1.35;
  }

  .message.markdown ul,
  .message.markdown ol {
    margin: 6px 0 10px 18px;
    padding: 0;
  }

  .message.markdown li {
    margin: 3px 0;
  }

  .message.markdown pre {
    margin: 8px 0;
    padding: 10px;
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--code-bg);
  }

  .message.markdown code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }

  .message.markdown :not(pre) > code {
    padding: 1px 4px;
    border-radius: 4px;
    background: var(--code-bg);
  }

  .message.markdown table {
    display: block;
    width: 100%;
    max-width: 100%;
    margin: 8px 0;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 12px;
  }

  .message.markdown th,
  .message.markdown td {
    padding: 6px 8px;
    border: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }

  .message.markdown th {
    background: var(--group-bg);
    font-weight: 700;
  }

  .message.markdown blockquote {
    margin: 8px 0;
    padding: 2px 0 2px 10px;
    border-left: 3px solid var(--line);
    color: var(--muted);
  }

  .message.markdown hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 10px 0;
  }

  .message.markdown a {
    color: var(--blue);
  }

  .message.user {
    align-self: flex-end;
    background: var(--blue);
    color: var(--primary-ink);
  }

  .message.ai {
    align-self: flex-start;
    background: var(--surface-soft);
    border: 1px solid var(--line);
  }

  .tool-card {
    border: 1px solid var(--tool-line);
    background: var(--tool-bg);
    color: var(--tool-ink);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 12px;
  }

  .assistant-workflow {
    border-top: 1px solid var(--line);
    padding: 10px 12px 0;
    display: grid;
    gap: 8px;
  }

  .assistant-workflow input {
    min-width: 0;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .assistant-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .assistant-actions .btn {
    min-width: 0;
    padding-inline: 8px;
  }

  .chat-input {
    padding: 12px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }

  .chat-input input {
    min-width: 0;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .modal-body textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    line-height: 1.45;
    color: var(--text);
    background: var(--surface);
  }

  .empty {
    padding: 24px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
  }

  @media (max-width: 1080px) {
    .content-grid { grid-template-columns: 1fr; }
    .dashboard-stack {
      height: auto;
      min-height: 0;
    }
    .resource-module .panel { height: auto; }
    .table-wrap { max-height: 360px; }
  }

  @media (max-width: 760px) {
    .topbar {
      align-items: stretch;
      flex-direction: column;
    }
    .top-actions { justify-content: flex-start; }
    .project-input { width: 100%; }
    .layout { padding: 12px; padding-bottom: 84px; }
    .assistant {
      right: 12px;
      bottom: 82px;
      width: calc(100vw - 24px);
      height: min(620px, calc(100vh - 108px));
    }
    .assistant-toggle {
      right: 14px;
      bottom: 14px;
    }
    .upload-choice,
    .assistant-actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">107 算力控制台</div>
      <div class="brand-subtitle">Slurm 资源监视、项目文件上传、智能助手</div>
    </div>
    <div class="top-actions">
      <button class="btn primary" onclick="openNewJobFlow()">+ 新作业</button>
      <button id="themeToggle" class="btn theme-toggle" onclick="toggleTheme()" title="切换暗夜模式">☾</button>
    </div>
  </header>

  <main class="layout">
    <section class="main">
      <section class="dashboard-stack">
        <section class="content-grid">
          <div class="resource-module">
            <div class="panel">
              <div class="panel-head">
                <div class="panel-heading">
                  <h2 class="panel-title">节点情况</h2>
                  <div id="nodeUsageSummary" class="panel-stat">正在加载节点数据</div>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>显卡类型</th>
                      <th>节点</th>
                      <th>状态</th>
                      <th>CPU</th>
                      <th>GPU</th>
                  </tr>
                </thead>
                <tbody id="nodesTable">
                  <tr><td colspan="5" class="empty">正在加载节点数据</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="resource-module">
            <div class="panel">
              <div class="panel-head">
                <div class="panel-heading">
                  <h2 class="panel-title">作业情况</h2>
                  <div id="jobsSummary" class="panel-stat">正在加载作业数据</div>
                  <div id="myJobsDetail" class="panel-stat secondary">我的作业状态等待数据</div>
                </div>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>用户</th>
                      <th>ID</th>
                      <th>名称</th>
                      <th>状态</th>
                      <th>分区</th>
                    </tr>
                  </thead>
                  <tbody id="jobsTable">
                    <tr><td colspan="5" class="empty">正在加载作业数据</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
        <div class="dashboard-footer">
          <button id="dashboardUpdatedAt" class="refresh-stamp" data-label="每 15 秒自动更新" data-hover="手动更新" onclick="handleUpdateStampClick()" title="手动更新"></button>
        </div>
      </section>
    </section>
  </main>
</div>

<script>
const projectNameInput = document.getElementById('projectNameInput');

let lastProjectDir = '';

const expandedJobGroups = new Set();

function applyTheme(theme) {
  const nextTheme = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = nextTheme;
  themeToggle.textContent = nextTheme === 'dark' ? '☀' : '☾';

}

function syncProjectName(value) {
  const name = (value || '').trim();

  assistantProjectNameInput.value = name;

syncProjectName(localStorage.getItem('slurmAgentProjectName') || '');
projectNameInput.addEventListener('input', () => syncProjectName(projectNameInput.value));
assistantProjectNameInput.addEventListener('input', () => syncProjectName(assistantProjectNameInput.value));

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value == null ? '' : String(value);
  return div.innerHTML;
}

function renderInlineMarkdown(value) {
  return escapeHtml(value)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
}

function renderMarkdown(markdown) {
  const text = String(markdown || '');
  const lines = text.split('\n');
  let html = '';
  let paragraph = [];
  let listItems = [];
  let listType = '';
  let inCode = false;
  let codeLines = [];
  let blockquote = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    html += `<p>${renderInlineMarkdown(paragraph.join(' '))}</p>`;
    paragraph = [];
  }

  function flushList() {
    if (!listItems.length) return;
    html += `<${listType}>${listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join('')}</${listType}>`;
    listItems = [];
    listType = '';
  }

  function flushBlockquote() {
    if (!blockquote.length) return;
    html += `<blockquote>${renderMarkdown(blockquote.join('\n'))}</blockquote>`;
    blockquote = [];
  }

  function isTableSeparator(value) {
    const trimmed = value.trim();
    if (!trimmed.includes('|')) return false;
    const cells = trimmed.replace(/^\||\|$/g, '').split('|');
    return cells.length > 1 && cells.every(cell => /^:?-{3,}:?$/.test(cell.trim()));
  }

  function renderTable(startIndex) {
    const header = lines[startIndex].trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
    let index = startIndex + 2;
    const rows = [];
    while (index < lines.length) {
      const rowLine = lines[index].trim();
      if (!rowLine.includes('|') || !rowLine) break;
      rows.push(rowLine.replace(/^\||\|$/g, '').split('|').map(cell => cell.trim()));
      index++;
    }

    let tableHtml = '<table><thead><tr>';
    for (const cell of header) tableHtml += `<th>${renderInlineMarkdown(cell)}</th>`;
    tableHtml += '</tr></thead><tbody>';
    for (const row of rows) {
      tableHtml += '<tr>';
      for (let i = 0; i < header.length; i++) {
        tableHtml += `<td>${renderInlineMarkdown(row[i] || '')}</td>`;
      }
      tableHtml += '</tr>';
    }
    tableHtml += '</tbody></table>';
    return { html: tableHtml, nextIndex: index };
  }

  for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
    const rawLine = lines[lineIndex];
    const line = rawLine.trimEnd();
    const trimmed = line.trim();

    if (trimmed.startsWith('```')) {
      flushParagraph();
      flushList();
      flushBlockquote();
      if (inCode) {
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        codeLines = [];
        inCode = false;
      } else {
        inCode = true;
      }
      continue;
    }

    if (inCode) {
      codeLines.push(rawLine);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushBlockquote();
      continue;
    }

    if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushBlockquote();
      html += '<hr>';
      continue;
    }

    if (lineIndex + 1 < lines.length && trimmed.includes('|') && isTableSeparator(lines[lineIndex + 1])) {
      flushParagraph();
      flushList();
      flushBlockquote();
      const table = renderTable(lineIndex);
      html += table.html;
      lineIndex = table.nextIndex - 1;
      continue;
    }

    const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
    if (heading) {
      flushParagraph();
      flushList();
      flushBlockquote();
      const level = heading[1].length;
      html += `<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`;
      continue;
    }

    const quote = trimmed.match(/^>\s?(.*)$/);
    if (quote) {
      flushParagraph();
      flushList();
      blockquote.push(quote[1]);
      continue;
    }

    const bullet = trimmed.match(/^[-*]\s+(.+)$/);
    const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);
    if (bullet || ordered) {
      flushParagraph();
      flushBlockquote();
      const nextType = ordered ? 'ol' : 'ul';
      if (listType && listType !== nextType) flushList();
      listType = nextType;
      listItems.push((bullet || ordered)[1]);
      continue;
    }

    paragraph.push(trimmed);
  }

  if (inCode) {
    html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
  }
  flushParagraph();
  flushList();
  flushBlockquote();
  return html || escapeHtml(text);
}

function setMessageContent(element, text, role = 'ai') {
  element.classList.toggle('markdown', role === 'ai');
  element.innerHTML = role === 'ai' ? renderMarkdown(text) : escapeHtml(text);
}

function addNotice(text, kind = 'notice') {
  const div = document.createElement('div');
  div.className = `toast ${kind === 'error' ? 'error' : 'notice'}`;
  const span = document.createElement('span');
  span.textContent = text;
  const close = document.createElement('button');
  close.className = 'toast-close';
  close.type = 'button';
  close.textContent = '×';
  close.title = '关闭';
  close.onclick = () => div.remove();
  div.appendChild(span);
  div.appendChild(close);
  noticesEl.prepend(div);
  while (noticesEl.children.length > 3) noticesEl.lastElementChild.remove();
  window.setTimeout(() => {
    if (div.isConnected) div.remove();
  }, kind === 'error' ? 6000 : 3000);
}

function openJobModal() {
  jobModal.classList.add('open');

}

    addChatMessage('请先创建本次作业目录，并补充环境依赖要求、算力特别需求。创建完成后我会先准备 conda 小房间；上传文件后，可以点“建议报告”让我整理依赖安装和 Slurm 提交配置草案。', 'ai');
    hasShownNewJobPrompt = true;
  }
  openJobModal();
}

function closeJobModal(event) {
  if (event && event.target !== jobModal) return;
  jobModal.classList.remove('open');
}

function currentProjectName() {
  return (
    assistantProjectNameInput.value ||
    projectNameInput.value ||
    localStorage.getItem('slurmAgentProjectName') ||
    ''
  ).trim();
}

function setUpdateStamps(label, hover = '手动更新', title = '手动更新') {
  const el = document.getElementById('dashboardUpdatedAt');
  el.dataset.label = label;
  el.dataset.hover = hover;
  el.title = title;
}

function markSlurmJwtInvalid() {
  setUpdateStamps('SLURM_JWT失效', '刷新SLURM_JWT', '刷新 SLURM_JWT');
}

async function handleUpdateStampClick() {

    const ok = await refreshSlurmApi(true);

function toggleAssistant(force) {
  const shouldOpen = typeof force === 'boolean' ? force : !assistantPanel.classList.contains('open');
  assistantPanel.classList.toggle('open', shouldOpen);
  if (shouldOpen) {
    window.setTimeout(() => userInput.focus(), 0);
  }
}

function stateClass(state) {
  const text = String(state || '').toUpperCase();
  if (text.includes('IDLE') || text.includes('COMPLETED')) return 'green';
  if (text.includes('ALLOC') || text.includes('RUNNING') || text === 'R') return 'blue';
  if (text.includes('PEND') || text.includes('MIX')) return 'amber';
  if (text.includes('DOWN') || text.includes('FAIL') || text.includes('CANCEL')) return 'red';
  return '';
}

function percent(used, total) {
  if (!total) return '-';
  return Math.round((used / total) * 100) + '%';
}

function formatUsage(used, total) {
  if (!total) return '-';
  return `${used}/${total}（${percent(used, total)}）`;
}

function summarizeStates(states) {
  const entries = Object.entries(states || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '无状态数据';
  return entries.slice(0, 4).map(([k, v]) => `${k} ${v}`).join(' / ');
}

function summarizeMyJobs(jobs, states) {
  if (!jobs.length) return '我的作业：暂无正在排队或运行的记录';
  const stateText = summarizeStates(states);
  const examples = jobs.slice(0, 3).map(job => `#${job.id} ${shortJobName(job.name)} ${job.state}`).join('；');
  const extra = jobs.length > 3 ? `；另有 ${jobs.length - 3} 个` : '';
  return `我的作业：${stateText} · ${examples}${extra}`;
}

function formatUpdateTime(value) {
  if (!value) return '每 15 秒自动更新';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return `更新于 ${value}`;
  const pad = n => String(n).padStart(2, '0');
  return `更新于 ${pad(date.getMonth() + 1)}-${pad(date.getDate())}  ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

function gpuType(node) {
  const text = String(node.gres || '').trim();
  const match = text.match(/gpu:([^:,]+)(?::(\d+))?/i);
  if (match) return match[1];
  return text.replace(/^gpu:/i, '') || 'CPU/其他';
}

function gpuCount(node) {
  if (Number.isFinite(Number(node.gpus))) return Number(node.gpus);
  const text = String(node.gres || '').trim();
  const match = text.match(/gpu:[^:,]+:(\d+)/i);
  return match ? Number(match[1]) : 0;
}

function gpuUsage(node) {
  const total = gpuCount(node);
  if (!total) return { used: 0, total: 0, partial: false };
  if (Number.isFinite(Number(node.alloc_gpus))) {
    return { used: Number(node.alloc_gpus), total, partial: false };
  }
  const state = String(node.state || '').toUpperCase();
  if (state.includes('IDLE')) return { used: 0, total, partial: false };
  if (state.includes('ALLOCATED') || state.includes('ALLOC')) return { used: total, total, partial: false };
  if (state.includes('MIXED')) return { used: 0, total, partial: true };
  return { used: 0, total, partial: false };
}

function summarizeGpuUsage(nodes) {
  const summary = { used: 0, total: 0, partial: false };
  for (const node of nodes || []) {
    const usage = gpuUsage(node);
    summary.used += usage.used;
    summary.total += usage.total;
    summary.partial = summary.partial || usage.partial;
  }
  return summary;
}

function formatGpuUsage(usage) {
  if (!usage.total) return '-';
  const prefix = usage.partial ? '部分使用 ' : '';
  return `${prefix}${formatUsage(usage.used, usage.total)}`;
}

function groupBy(items, getter) {
  const groups = new Map();
  for (const item of items) {
    const key = getter(item) || 'UNKNOWN';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  }
  return Array.from(groups.entries()).sort((a, b) => String(a[0]).localeCompare(String(b[0])));
}

function renderNodeGroups(nodes) {
  if (!nodes.length) return '<tr><td colspan="5" class="empty">暂无节点数据</td></tr>';
  return groupBy(nodes, gpuType).map(([type, group], index) => {
    const states = {};
    let cpus = 0;
    let allocCpus = 0;
    for (const node of group) {
      const state = String(node.state || 'UNKNOWN').split(',', 1)[0].toUpperCase();
      states[state] = (states[state] || 0) + 1;
      cpus += Number(node.cpus || 0);
      allocCpus += Number(node.alloc_cpus || 0);
    }
    const gpuUsageText = formatGpuUsage(summarizeGpuUsage(group));
    const key = `node-${index}`;
    const expanded = expandedNodeGroups.has(key);
    const summaryRow = `
      <tr class="group-row" onclick="toggleNodeGroup('${key}')">
        <td class="group-title"><span class="group-caret">${expanded ? '▼' : '▶'}</span>${escapeHtml(type)}</td>
        <td>${group.length} 台节点</td>
        <td>${escapeHtml(summarizeStates(states))}</td>
        <td>${escapeHtml(formatUsage(allocCpus, cpus))}</td>
        <td>${escapeHtml(gpuUsageText)}</td>
      </tr>
    `;
    const detailRows = expanded ? group.map(node => `
      <tr>
        <td>${escapeHtml(type)}</td>
        <td>${escapeHtml(node.name)}</td>
        <td><span class="pill ${stateClass(node.state)}">${escapeHtml(node.state)}</span></td>
        <td>${escapeHtml(formatUsage(Number(node.alloc_cpus || 0), Number(node.cpus || 0)))}</td>
        <td>${escapeHtml(formatGpuUsage(gpuUsage(node)))}</td>
      </tr>
    `).join('') : '';
    return summaryRow + detailRows;
  }).join('');
}

function renderJobGroups(jobs) {
  if (!jobs.length) return '<tr><td colspan="5" class="empty">暂无作业数据</td></tr>';
  const currentUser = (window.lastDashboardData?.summary?.current_user || '').toString();
  const groups = groupBy(jobs, job => job.user).sort((a, b) => {
    if (String(a[0]) === currentUser) return -1;
    if (String(b[0]) === currentUser) return 1;
    return String(a[0]).localeCompare(String(b[0]));
  });
  return groups.map(([user, group], index) => {
    const states = {};
    for (const job of group) {
      const state = String(job.state || 'UNKNOWN').split(',', 1)[0].toUpperCase();
      states[state] = (states[state] || 0) + 1;
    }
    const key = `job-${index}`;
    if (!initializedCurrentUserGroup && currentUser && String(user) === currentUser) {
      expandedJobGroups.add(key);
    }
    const expanded = expandedJobGroups.has(key);
    const userLabel = String(user) === currentUser ? `${user}（我）` : user;
    const summaryRow = `
      <tr class="group-row" onclick="toggleJobGroup('${key}')">
        <td class="group-title"><span class="group-caret">${expanded ? '▼' : '▶'}</span>${escapeHtml(userLabel)}</td>
        <td colspan="2">${group.length} 个作业</td>
        <td colspan="2">${escapeHtml(summarizeStates(states))}</td>
      </tr>
    `;
    const detailRows = expanded ? group.map(job => `
      <tr>
        <td>${escapeHtml(userLabel)}</td>
        <td>${escapeHtml(job.id)}</td>
        <td><div class="truncate" title="${escapeHtml(job.name)}" onclick="event.stopPropagation(); this.classList.toggle('expanded'); this.textContent = this.classList.contains('expanded') ? this.title : shortJobName(this.title)">${escapeHtml(shortJobName(job.name))}</div></td>
        <td><span class="pill ${stateClass(job.state)}">${escapeHtml(job.state)}</span></td>
        <td>${escapeHtml(job.partition)}</td>
      </tr>
    `).join('') : '';
    return summaryRow + detailRows;
  }).join('');
}

function shortJobName(name) {
  const text = String(name || '-');
  const vscodeAt = text.toLowerCase().indexOf('vscode');
  if (vscodeAt >= 0) return text.slice(0, vscodeAt + 'vscode'.length);
  return text.length > 18 ? text.slice(0, 18) + '...' : text;
}

function toggleNodeGroup(key) {
  if (expandedNodeGroups.has(key)) expandedNodeGroups.delete(key);
  else expandedNodeGroups.add(key);
  renderDashboard(window.lastDashboardData || {});
}

function toggleJobGroup(key) {
  if (expandedJobGroups.has(key)) expandedJobGroups.delete(key);
  else expandedJobGroups.add(key);
  renderDashboard(window.lastDashboardData || {});
}

function renderDashboard(data) {
  window.lastDashboardData = data;
  const summary = data.summary || {};
  const updatedText = formatUpdateTime(data.updated_at);
  const nodes = data.nodes || [];
  const gpuUsageText = formatGpuUsage(summarizeGpuUsage(nodes));
  document.getElementById('nodeUsageSummary').textContent =
    `${summary.node_count || 0} 台节点 · CPU ${formatUsage(summary.alloc_cpus || 0, summary.total_cpus || 0)} · GPU ${gpuUsageText}`;
  document.getElementById('jobsSummary').textContent =
    `全部 ${summary.job_count || 0} 个作业 · 我的 ${summary.my_job_count || 0} 个`;
  document.getElementById('myJobsDetail').textContent =
    summarizeMyJobs(data.my_jobs || [], summary.my_job_states || {});
  setUpdateStamps(updatedText, '手动更新', '手动更新');

  document.getElementById('nodesTable').innerHTML = renderNodeGroups(nodes);

  const jobs = data.jobs || [];
  document.getElementById('jobsTable').innerHTML = renderJobGroups(jobs);
  initializedCurrentUserGroup = true;

  if (data.errors && data.errors.length) {
    addNotice(data.errors.join('；'), 'error');
  }
}

async function refreshDashboard(manual = false, retryCount = 0) {
  if (dashboardRefreshing && !manual) return;
  dashboardRefreshing = true;
  try {
    const resp = await fetch('/api/dashboard');
    const data = await resp.json();
    if (!resp.ok || data.status !== 'ok') {
      if (retryCount < 3) {
        await refreshSlurmApi(false);
        dashboardRefreshing = false;
        return refreshDashboard(manual, retryCount + 1);
      }
      markSlurmJwtInvalid();
      if (manual) addNotice(data.error || (data.errors || []).join('；') || 'Dashboard 更新失败', 'error');
      return;
    }
    renderDashboard(data);
  } catch (e) {
    if (retryCount < 3) {
      await refreshSlurmApi(false);
      dashboardRefreshing = false;
      return refreshDashboard(manual, retryCount + 1);
    }
    markSlurmJwtInvalid();
    if (manual) addNotice('Dashboard 更新失败: ' + e.message, 'error');
  } finally {
    dashboardRefreshing = false;
  }
}

async function createProject() {
  const name = projectNameInput.value.trim();
  if (!name) {
    addNotice('请先输入作业目录名称', 'error');
    projectNameInput.focus();
    return;
  }
  const createButton = document.querySelector('#jobModal .btn.primary');
  const originalText = createButton ? createButton.textContent : '';
  if (createButton) {
    createButton.disabled = true;
    createButton.textContent = '创建并初始化中...';
  }
  addNotice('正在创建作业目录并初始化 miniconda 小房间...');
  try {
    const resp = await fetch('/api/projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        environment_requirements: envRequirementsInput.value.trim(),
        compute_requirements: computeRequirementsInput.value.trim(),
      }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      addNotice(data.error || '创建作业目录失败', 'error');
      return;
    }
    syncProjectName(data.project_name);
    closeJobModal();
    addNotice(`作业目录已创建：${data.project_dir}；conda 小房间${data.conda_created ? '已创建' : '已存在'}：${data.conda_env_dir}`);
    toggleAssistant(true);
    addChatMessage(`### 作业目录已准备好

- 项目目录：\`${data.project_dir}\`
- miniconda 小房间：\`${data.conda_env_dir}\`
- 需求记录：\`${data.notes_path}\`
- 环境状态：${data.conda_created ? '已完成初始化' : '已存在，继续复用'}

下一步请在聊天框上方选择 **文件** 或 **文件夹** 上传项目内容。上传完成后点击 **建议报告**，我会整理依赖安装和 Slurm 算力配置草案。`, 'ai');
  } catch (e) {
    addNotice('创建作业目录失败: ' + e.message, 'error');
  } finally {
    if (createButton) {
      createButton.disabled = false;
      createButton.textContent = originalText;
    }
  }
}

async function refreshSlurmApi(notify = true) {
  if (notify) addNotice('正在刷新 Slurm API 认证...');
  try {
    const resp = await fetch('/api/slurm/refresh', { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) {
      if (notify) addNotice(data.error || '刷新 Slurm 失败', 'error');
      return false;
    }
    if (notify) {
      addNotice(`Slurm 已刷新：${data.token_preview}`);
    }
    return true;
  } catch (e) {
    if (notify) addNotice('刷新 Slurm 失败: ' + e.message, 'error');
    return false;
  }
}

function chooseUploadFiles() {
  if (isUploading) return;
  if (!currentProjectName()) {
    addNotice('请先输入作业目录名称', 'error');
    toggleAssistant(true);
    assistantProjectNameInput.focus();
    return;
  }
  fileUploadInput.value = '';
  fileUploadInput.click();
}

function chooseUploadFolder() {
  if (isUploading) return;
  if (!currentProjectName()) {
    addNotice('请先输入作业目录名称', 'error');
    toggleAssistant(true);
    assistantProjectNameInput.focus();

function formatBytes(bytes) {
  if (!Number.isFinite(bytes)) return '未知大小';
  const units = ['B', 'KB', 'MB', 'GB'];
  let value = bytes;
  let unit = 0;
  while (value >= 1024 && unit < units.length - 1) {
    value /= 1024;
    unit++;
  }
  return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
}

async function uploadSelectedFiles(input) {
  const selected = Array.from(input.files || []);
  if (!selected.length || isUploading) return;
  const projectName = currentProjectName();
  if (!projectName) {
    addNotice('请先输入作业目录名称', 'error');
    input.value = '';
    openNewJobFlow();
    return;
  }

  const formData = new FormData();
  formData.append('project_name', projectName);
  for (const file of selected) {
    formData.append('files', file, file.webkitRelativePath || file.name);
  }

  isUploading = true;
  addNotice(`正在上传 ${selected.length} 个文件...`);
  try {
    const resp = await fetch('/api/files/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    if (!resp.ok) {
      addNotice(data.error || '文件上传失败', 'error');
      return;
    }
    syncProjectName(data.project_name);
    addNotice(`上传完成：${data.file_count} 个文件，${formatBytes(data.archive_size)}，目录 ${data.remote_project_dir}；conda 小房间${data.conda_created ? '已创建' : '已存在'}：${data.conda_env_dir}`);
    toggleAssistant(true);
    addChatMessage(`### 文件上传完成

- 文件数：${data.file_count}
- 压缩包大小：${formatBytes(data.archive_size)}
- 项目目录：\`${data.remote_project_dir}\`
- SHA256：\`${data.local_sha256}\`

现在建议点击上方 **建议报告**。如果你还有修改意见，也可以先写在下面输入框里，再点击 **建议报告**，我会把追加内容一起记录进项目说明。`, 'ai');
  } catch (e) {
    addNotice('文件上传失败: ' + e.message, 'error');
  } finally {
    isUploading = false;
    input.value = '';
  }
}

async function generateProjectReport() {
  const projectName = currentProjectName();
  if (!projectName) {
    addNotice('请先输入作业目录名称', 'error');
    toggleAssistant(true);
    assistantProjectNameInput.focus();
    return;
  }
  if (isProcessing) return;

  const extraNotes = userInput.value.trim();
  if (extraNotes) {
    addChatMessage(extraNotes, 'user');
    userInput.value = '';
  }

  isProcessing = true;
  sendBtn.disabled = true;
  confirmRunBtn.disabled = true;
  addNotice('正在生成建议报告...');
  const pending = addChatMessage('正在读取项目说明、目录和脚本，生成提交前建议报告...', 'ai');
  try {
    const resp = await fetch('/api/projects/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: projectName, extra_notes: extraNotes }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      setMessageContent(pending, data.error || '生成建议报告失败', 'ai');
      addNotice(data.error || '生成建议报告失败', 'error');
      return;
    }
    syncProjectName(data.project_name);
    lastProjectReport = data.report || '';
    lastProjectDir = data.project_dir || '';
    setMessageContent(pending, data.report, 'ai');
    confirmRunBtn.disabled = false;
    addNotice(`建议报告已生成，需求记录：${data.notes_path}`);
    addChatMessage(`请检查上面的建议报告。

- 如果需要修改：把修改意见写在下面输入框里，再点 **建议报告**，我会把意见追加到需求记录并重新生成。
- 如果确认无误：点击 **确认执行**，我会把已确认的方案交给智能体继续生成/提交作业命令。`, 'ai');
  } catch (e) {
    setMessageContent(pending, '生成建议报告失败: ' + e.message, 'ai');
    addNotice('生成建议报告失败: ' + e.message, 'error');
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
  }
}

async function confirmRunPlan() {
  const projectName = currentProjectName();
  if (!projectName || !lastProjectReport) {
    addNotice('请先生成建议报告，再确认执行', 'error');
    return;
  }
  if (isProcessing) return;

  const message = `我确认执行当前建议报告。请基于下面的信息继续推进：如果信息仍不足，先只问最关键的缺失项；如果已经足够，请生成规范的 sbatch 脚本，并调用 submit_job 提交作业。

约束：
- 项目目录：${lastProjectDir || projectName}
- 输出目录必须规范化到项目目录下 runs/<作业名>-%j/
- Slurm 标准输出/错误使用 runs/<作业名>-%j.out 和 runs/<作业名>-%j.err
- 提交前不要使用交互式命令
- 如需要安装依赖，请优先使用项目目录里的 .slurm-agent/conda-env

已确认建议报告：
${lastProjectReport.slice(0, 12000)}`;

  await sendMessage(
    message,
    '已确认执行。请根据建议报告准备提交；如果还缺必要信息，请先问我。'
  );
}

function addChatMessage(text, role) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  setMessageContent(div, text, role);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addToolCard(name, result = '') {
  const div = document.createElement('div');
  div.className = 'tool-card';
  div.textContent = result ? `工具 ${name} 完成：${result}` : `正在执行工具 ${name}...`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage(forcedText = null, displayText = null) {
  const text = (forcedText == null ? userInput.value : forcedText).trim();
  if (!text || isProcessing) return;

  isProcessing = true;
  sendBtn.disabled = true;
  userInput.value = '';
  addChatMessage(displayText || text, 'user');
  currentAiMessage = null;
  currentAiText = '';

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      addChatMessage(err.error || '请求失败', 'ai');
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const event = JSON.parse(line.slice(6));
        if (event.type === 'text') {
          if (!currentAiMessage) currentAiMessage = addChatMessage('', 'ai');
          currentAiText += event.content || '';
          setMessageContent(currentAiMessage, currentAiText, 'ai');
        } else if (event.type === 'tool_start') {
          addToolCard(event.tool);
        } else if (event.type === 'tool_end') {
          addToolCard(event.tool, event.result || '');
        } else if (event.type === 'error') {
          addChatMessage(event.content || '服务异常', 'ai');
        }
      }
    }
  } catch (e) {
    addChatMessage('网络错误: ' + e.message, 'ai');
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

async function resetChat() {
  try {
    await fetch('/reset', { method: 'POST' });
    messagesEl.innerHTML = '<div class="message ai">对话已重置。可以继续查询资源、生成脚本或准备提交命令。</div>';
    lastProjectReport = '';
    lastProjectDir = '';
    confirmRunBtn.disabled = true;
  } catch (e) {
    addNotice('重置失败: ' + e.message, 'error');
  }
}
